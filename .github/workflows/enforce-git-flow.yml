name: enforce-git-flow

# Garante rigorosamente feature/* -> develop -> homolog -> main.
# PR pra main so pode vir de homolog; PR pra homolog so pode vir de develop.
# Hotfixes e fixes tambem devem seguir a esteira para evitar desvio de codigo.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - homolog

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Valida branch de origem
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "PR: $HEAD_REF -> $BASE_REF"

          if [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" = "homolog" ]; then
              echo "OK: main so recebe de homolog."
              exit 0
            fi
            echo "BLOQUEADO: PR pra 'main' OBRIGATORIAMENTE precisa vir de 'homolog'."
            echo "Ate mesmo Hotfixes devem seguir o fluxo para nao desalinhar branches."
            echo "Origem encontrada: '$HEAD_REF'. Git Flow do projeto: feature/hotfix -> develop -> homolog -> main."
            exit 1
          fi

          if [ "$BASE_REF" = "homolog" ]; then
            if [ "$HEAD_REF" = "develop" ]; then
              echo "OK: homolog so recebe de develop."
              exit 0
            fi
            echo "BLOQUEADO: PR pra 'homolog' OBRIGATORIAMENTE precisa vir de 'develop'."
            echo "Ate mesmo Hotfixes devem seguir o fluxo para nao desalinhar branches."
            echo "Origem encontrada: '$HEAD_REF'. Git Flow do projeto: feature/hotfix -> develop -> homolog -> main."
            exit 1
          fi

          echo "Base '$BASE_REF' fora do escopo deste check, ignorando."

