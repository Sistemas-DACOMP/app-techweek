name: Deploy to Firebase (Frontend & Backend)

on:
  push:
    branches:
      - homolog
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Firebase (${{ github.ref_name == 'main' && 'Production' || 'Homologation' }})
    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || 'Homologation' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --no-audit

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps --no-audit || npm install --legacy-peer-deps --no-audit

      - name: Configure backend environment (.env)
        env:
          SCREEN_TOKEN_SECRET: ${{ secrets.SCREEN_TOKEN_SECRET }}
          SYMPLA_API_TOKEN: ${{ secrets.SYMPLA_API_TOKEN }}
          SYMPLA_EVENT_ID: ${{ secrets.SYMPLA_EVENT_ID }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          DEBUG_CLIENT_IP: ${{ secrets.DEBUG_CLIENT_IP }}
          TRUST_PROXY_HOPS: ${{ secrets.TRUST_PROXY_HOPS }}
        run: |
          cat << EOF > backend/.env
          SCREEN_TOKEN_SECRET=${SCREEN_TOKEN_SECRET}
          SYMPLA_API_TOKEN=${SYMPLA_API_TOKEN}
          SYMPLA_EVENT_ID=${SYMPLA_EVENT_ID}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          RESEND_API_KEY=${RESEND_API_KEY}
          EMAIL_FROM=${EMAIL_FROM}
          APP_BASE_URL=${APP_BASE_URL}
          DEBUG_CLIENT_IP=${DEBUG_CLIENT_IP}
          TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS}
          EOF

      - name: Build backend
        run: (cd backend && npm run build)

      - name: Build frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_BASE_PATH: /

      - name: Authenticate Google Cloud Service Account
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FACOM_TECHWEEK_LAYERX }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/service-account.json"
          printf '%s' "$SERVICE_ACCOUNT_KEY" > "backend/service-account.json"

      - name: Deploy to Firebase (Hosting, Firestore Rules, Storage Rules)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID || 'facom-techweek-homolog' }}"
          npx firebase-tools deploy --only hosting,firestore:rules,storage --project "$PROJECT_ID" --non-interactive

      - name: Deploy to Firebase (Cloud Functions)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID || 'facom-techweek-homolog' }}"
          npx firebase-tools deploy --only functions --project "$PROJECT_ID" --non-interactive || {
            echo "::warning::Deploy de Cloud Functions (2nd Gen) exige que a Service Account possua Project IAM Admin ou que os 3 comandos gcloud projects add-iam-policy-binding sejam executados uma vez pelo Owner do projeto GCP."
            exit 1
          }
