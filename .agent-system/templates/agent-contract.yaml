# Template — copy into the frontmatter of any agents/<id>.md file.
# This is the "portability contract" (spec section 10).

agent:
  id: <agent-id>              # kebab-case, matches filename

runtime_requirements:         # the agent CANNOT function without these
  - filesystem
  - shell
  # add: git, github, jira, browser, firebase, docker, test-runner — only what's truly required

optional:                     # the agent degrades gracefully without these
  - github
  - jira

inputs:
  - task                      # the task/ticket description
  - spec                      # relevant SPEC.md / acceptance criteria, if any
  - relevant_rules            # pointer(s) into .agent-system/rules|policies

outputs:
  - findings
  - implementation            # omit if the agent is analysis-only
  - tests                     # omit if not applicable
  - handoff

portable: true|false          # false only when a hard runtime dependency has no adapter yet
portability_note: >
  One sentence: why true, or what's missing for false.
